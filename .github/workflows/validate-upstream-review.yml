name: Validate upstream upgrade (isolated)

on:
  push:
    branches:
      - review/upstream-2026-11-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm integrated upstream commit
        run: git merge-base --is-ancestor aff2865bf8079b03051a235b3fe4eb09fd49b4aa HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck web
        working-directory: web
        run: npx tsc --noEmit

      - name: Test web
        working-directory: web
        run: npm test

      - name: Build web without production services
        working-directory: web
        env:
          VERCEL: "1"
          DEMO_MODE: "true"
          DATABASE_URL: "postgres://ci:ci@localhost:5432/ci"
        run: npm run build
