name: Check upstream updates

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-upstream-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compare fork and publish Danish update summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM="drkostas/hevy2garmin"
          TITLE="[Upstream Update] hevy2garmin has new commits"
          git fetch --no-tags https://github.com/${UPSTREAM}.git main:refs/remotes/upstream/main
          BEHIND=$(git rev-list --count HEAD..refs/remotes/upstream/main)
          echo "Upstream commits missing from fork: $BEHIND"

          EXISTING=$(gh issue list --repo "$GH_REPO" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)

          if [ "$BEHIND" -eq 0 ]; then
            echo "Fork is up to date; no issue created or modified."
            exit 0
          fi

          python3 .github/scripts/upstream_summary_da.py HEAD refs/remotes/upstream/main

          if [ -n "$EXISTING" ]; then
            echo "Refreshing existing update issue #$EXISTING"
            gh issue edit "$EXISTING" --repo "$GH_REPO" \
              --body-file /tmp/upstream-update-issue.md
          else
            echo "Creating update issue"
            gh issue create --repo "$GH_REPO" --title "$TITLE" \
              --body-file /tmp/upstream-update-issue.md
          fi
